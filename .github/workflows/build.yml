name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt entpacken
        run: |
          set -e
          base64 -d > p.txz <<'B64'
          
          
          
          
          
          
          
          
          9lUvuHX7UKtksELcRrK4rrU+1hrfHR1d7pVbjmR2AAAfQFtZ2lVCNQAB+12A4AMAJQMVE7HEZ/sCAAAAAARZWg==
          B64
          echo "2f09e1e9bf6279ecb545bbad520f686eb73cd83bc64d0123f89c7753c921dfa4  p.txz" | sha256sum -c || { echo "::error::build.yml unvollständig eingefügt – bitte komplett neu kopieren"; exit 1; }
          tar xJf p.txz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RB-USB-Export-apk
          path: app/build/outputs/apk/release/*.apk
          
