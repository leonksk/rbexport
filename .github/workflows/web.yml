name: Web App
on:
  push:
    paths: ['.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: Web-App entpacken
        run: |
          set -e
          mkdir site && cd site
          base64 -d > w.txz <<'B64'
          
          
          
          
          
          
          B64
          echo "6d6f813d134aaeb155d26a5ed90ad201c8839c17a2a00ce0d8fc81bba4c17580  w.txz" | sha256sum -c || { echo "::error::web.yml unvollständig eingefügt – bitte komplett neu kopieren"; exit 1; }
          tar xJf w.txz && rm w.txz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
